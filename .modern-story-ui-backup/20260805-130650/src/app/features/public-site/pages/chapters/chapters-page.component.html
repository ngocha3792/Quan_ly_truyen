<section class="page-shell chapter-list-page">
  <div class="breadcrumb">
    <a routerLink="/">Trang chủ</a><span>›</span
    ><a routerLink="/story/dai-dao-chi-ton">Đại Đạo Chí Tôn</a><span>›</span><b>Danh sách chương</b>
  </div>
  <article class="panel chapter-list-card" appCard>
    <header>
      <div>
        <h1>Tổng 1278 chương</h1>
        <p>Cập nhật mới nhất mỗi ngày</p>
      </div>
      <label
        ><span>Sắp xếp</span
        ><select>
          <option>Mới nhất</option>
          <option>Cũ nhất</option>
        </select></label
      >
    </header>
    <div class="chapter-columns">
      <div>
        @for (chapter of chapters; track chapter.number) {
          <a [routerLink]="['/read/dai-dao-chi-ton', chapter.number]"
            ><strong>Chương {{ chapter.number }} - {{ chapter.title }}</strong
            ><time>{{ chapter.date }}</time></a
          >
        }
      </div>
      <aside>
        <button class="active" appButton>1271 - 1278</button><button appButton>1261 - 1270</button
        ><button appButton>1251 - 1260</button><button appButton>1241 - 1250</button
        ><button appButton>1231 - 1240</button><button appButton>1 - 10</button>
      </aside>
    </div>
  </article>
</section>
