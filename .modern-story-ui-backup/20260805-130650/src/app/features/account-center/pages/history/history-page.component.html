<article class="panel full-page-panel" appCard>
  <div class="toolbar">
    <div class="tabs">
      @for (tab of ['Tất cả', 'Đang đọc', 'Đã hoàn thành', 'Đã tạm dừng']; track tab) {
        <button
          type="button"
          [class.active]="activeHistoryTab() === tab"
          (click)="activeHistoryTab.set(tab)"
          appButton
        >
          {{ tab }}
        </button>
      }
    </div>
    <button type="button" class="danger-button" appButton>Xóa lịch sử đọc</button>
  </div>

  <div class="history-list">
    @for (story of stories.slice(0, 6); track story.id) {
      <article>
        <img [src]="story.image" [alt]="story.title" />
        <div class="history-copy">
          <strong>{{ story.title }}</strong>
          <a href="#" (click)="$event.preventDefault()">{{ story.chapter }}</a>
          <small>Đọc đến {{ story.progress }}%</small>
          <div><i [style.width.%]="story.progress"></i></div>
        </div>
        <time>{{ story.updated }}</time>
        <button type="button" appButton>Tiếp tục đọc</button>
      </article>
    }
  </div>
</article>
