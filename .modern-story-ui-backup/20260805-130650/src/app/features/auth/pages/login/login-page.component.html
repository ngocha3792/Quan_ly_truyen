<main class="login-layout">
  <div class="login-hero">
    <div class="hero-copy">
      <h1>Chào mừng trở lại <span>👋</span></h1>
      <p>Đăng nhập để tiếp tục hành trình đọc truyện</p>
    </div>

    <app-auth-card class="login-card">
      <div class="auth-tabs">
        <a class="active" routerLink="/auth/login">
          <app-auth-icon name="lock" />
          Đăng nhập
        </a>
        <a routerLink="/auth/register">
          <app-auth-icon name="user" />
          Đăng ký
        </a>
      </div>

      <form (submit)="$event.preventDefault()">
        <label>
          <span>Email hoặc tên đăng nhập</span>
          <div class="field">
            <app-auth-icon name="user" />
            <input type="text" placeholder="Nhập email hoặc tên đăng nhập" />
          </div>
        </label>

        <label>
          <span>Mật khẩu</span>
          <div class="field">
            <app-auth-icon name="lock" />
            <input [type]="showPassword() ? 'text' : 'password'" placeholder="Nhập mật khẩu" />
            <button
              type="button"
              aria-label="Hiện hoặc ẩn mật khẩu"
              (click)="togglePassword()"
              appButton
            >
              <app-auth-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
            </button>
          </div>
        </label>

        <div class="form-options">
          <label class="checkbox-row">
            <input
              type="checkbox"
              [checked]="rememberMe()"
              (change)="rememberMe.set($any($event.target).checked)"
            />
            <span><app-auth-icon name="check" /></span>
            Ghi nhớ đăng nhập
          </label>

          <a href="#" (click)="$event.preventDefault()">Quên mật khẩu?</a>
        </div>

        <button class="submit-button" type="submit" appButton>
          Đăng nhập
          <app-auth-icon name="arrow-right" />
        </button>
      </form>

      <div class="social-divider"><span>hoặc đăng nhập với</span></div>

      <app-social-auth-buttons />
    </app-auth-card>

    <p class="switch-copy">
      Chưa có tài khoản?
      <a routerLink="/auth/register">Đăng ký ngay</a>
    </p>
  </div>

  <app-auth-benefits class="login-benefits" variant="login" [benefits]="footerBenefits" />
</main>
