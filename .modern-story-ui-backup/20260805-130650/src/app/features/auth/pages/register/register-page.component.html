<main class="register-layout">
  <section class="register-main">
    <a class="back-link" routerLink="/auth/login">
      <app-auth-icon name="arrow-left" />
      Quay lại đăng nhập
    </a>

    <div class="register-heading">
      <h1>Tạo tài khoản mới <span>🚀</span></h1>
      <p>Tham gia cộng đồng độc giả của chúng tôi</p>
    </div>

    <app-auth-card class="register-card">
      <form (submit)="$event.preventDefault()">
        <label>
          <span>Tên hiển thị</span>
          <div class="field">
            <app-auth-icon name="user" />
            <input type="text" placeholder="Nhập tên hiển thị của bạn" />
          </div>
        </label>

        <label>
          <span>Email</span>
          <div class="field">
            <app-auth-icon name="mail" />
            <input type="email" placeholder="Nhập email của bạn" />
          </div>
        </label>

        <label>
          <span>Tên đăng nhập</span>
          <div class="field">
            <app-auth-icon name="user" />
            <input type="text" placeholder="Nhập tên đăng nhập" />
          </div>
        </label>

        <label>
          <span>Mật khẩu</span>
          <div class="field">
            <app-auth-icon name="lock" />
            <input
              [type]="showPassword() ? 'text' : 'password'"
              placeholder="Tạo mật khẩu (ít nhất 6 ký tự)"
            />
            <button
              type="button"
              aria-label="Hiện hoặc ẩn mật khẩu"
              (click)="togglePassword()"
              appButton
            >
              <app-auth-icon [name]="showPassword() ? 'eye-off' : 'eye'" />
            </button>
          </div>
        </label>

        <label>
          <span>Xác nhận mật khẩu</span>
          <div class="field">
            <app-auth-icon name="lock" />
            <input
              [type]="showConfirmPassword() ? 'text' : 'password'"
              placeholder="Nhập lại mật khẩu"
            />
            <button
              type="button"
              aria-label="Hiện hoặc ẩn xác nhận mật khẩu"
              (click)="toggleConfirmPassword()"
              appButton
            >
              <app-auth-icon [name]="showConfirmPassword() ? 'eye-off' : 'eye'" />
            </button>
          </div>
        </label>

        <label class="checkbox-row terms-row">
          <input
            type="checkbox"
            [checked]="acceptedTerms()"
            (change)="acceptedTerms.set($any($event.target).checked)"
          />
          <span><app-auth-icon name="check" /></span>
          <span>
            Tôi đồng ý với
            <a href="#" (click)="$event.preventDefault()">Điều khoản sử dụng</a>
            và
            <a href="#" (click)="$event.preventDefault()">Chính sách bảo mật</a>
          </span>
        </label>

        <button class="submit-button" type="submit" appButton>
          Đăng ký
          <app-auth-icon name="arrow-right" />
        </button>
      </form>

      <div class="social-divider"><span>hoặc đăng ký với</span></div>

      <app-social-auth-buttons />

      <p class="register-switch-copy">
        Đã có tài khoản?
        <a routerLink="/auth/login">Đăng nhập ngay</a>
      </p>
    </app-auth-card>
  </section>

  <app-auth-benefits class="register-benefits" variant="register" [benefits]="registerBenefits" />
</main>
