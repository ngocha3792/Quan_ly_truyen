<main class="workspace-page author-dashboard">
  @if (store.dashboard(); as dashboard) {
    <app-breadcrumb [items]="breadcrumbs" />
    <app-page-heading
      title="Tổng quan tác giả 👋"
      description="Tổng hợp nhanh tình hình sáng tác và hiệu suất truyện của bạn."
      icon="home"
    />

    <section class="metric-grid">
      @for (metric of dashboard.metrics; track metric.id) {
        <app-stat-card
          [label]="metric.title"
          [value]="metric.value"
          [icon]="metric.icon"
          [tone]="metric.tone"
        />
      }
    </section>

    <section class="dashboard-row dashboard-row--analytics">
      <app-readership-chart
        [points]="store.readershipPoints()"
        [period]="store.selectedPeriod()"
        (periodChange)="changePeriod($event)"
      ></app-readership-chart>
    </section>

    <section class="dashboard-row dashboard-row--management">
      <app-author-story-table [stories]="dashboard.stories"></app-author-story-table>

      <app-recent-drafts [drafts]="dashboard.drafts"></app-recent-drafts>

      <app-reader-comments [comments]="dashboard.comments"></app-reader-comments>
    </section>

    <app-dashboard-bottom-panels [topStories]="dashboard.topStories"></app-dashboard-bottom-panels>
  }
</main>
