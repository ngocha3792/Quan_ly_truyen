@for (benefit of benefits; track benefit.title) {
  <article>
    <span
      [class]="
        variant === 'register'
          ? 'register-benefit-icon register-benefit-icon--' + benefit.tone
          : 'benefit-icon benefit-icon--' + benefit.tone
      "
    >
      <app-auth-icon [name]="benefit.icon" />
    </span>
    <div>
      <strong>{{ benefit.title }}</strong>
      <p>{{ benefit.description }}</p>
    </div>
  </article>
}
