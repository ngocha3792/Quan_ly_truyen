<main class="workspace-page">
  <div class="page-container">
    <app-breadcrumb [items]="breadcrumbs" />

    <span class="mrv-eyebrow">Manual review</span>
    <app-page-heading
      title="Đơn chuyển khoản chờ xác nhận"
      description="Quản lý các giao dịch chuyển khoản thủ công đang chờ xác nhận, đối soát và xử lý."
      icon="wallet"
    >
      <div class="mrv-actions">
        <app-button
          variant="secondary"
          type="button"
          [loading]="store.loading()"
          (click)="store.load()"
        >
          Làm mới
        </app-button>
        <a class="mrv-link-action" routerLink="/admin/settings/payments">Cấu hình ngân hàng</a>
        <app-button
          variant="primary"
          type="button"
          [disabled]="!store.hasRows()"
          (click)="exportCsv()"
        >
          Xuất danh sách
        </app-button>
      </div>
    </app-page-heading>

    @if (store.error(); as error) {
      <app-error-alert [message]="error" (retry)="store.load()" />
    }
    @if (store.notice(); as notice) {
      <p class="mrv-notice" role="status">{{ notice }}</p>
    }

    <div class="mrv-stat-grid">
      @for (stat of stats(); track stat.label) {
        <app-stat-card
          [label]="stat.label"
          [value]="stat.value"
          [icon]="stat.icon"
          [tone]="stat.tone"
        >
          <span statMeta class="mrv-stat-meta">{{ stat.meta }}</span>
        </app-stat-card>
      }
    </div>

    <div class="mrv-layout">
      <div class="mrv-stack">
        <app-manual-review-filters
          [value]="store.filters()"
          [busy]="store.loading()"
          (applied)="applyFilters($event)"
          (cleared)="store.resetFilters()"
        />

        <app-manual-review-table
          [orders]="store.orders()"
          [loading]="store.loading()"
          [reviewingId]="store.reviewing()"
          [page]="store.page()"
          [totalPages]="store.totalPages()"
          [pageSize]="store.pageSize()"
          [totalItems]="store.totalItems()"
          (decided)="openDecision($event)"
          (pageChanged)="store.goToPage($event)"
          (pageSizeChanged)="store.changePageSize($event)"
        />
      </div>

      <app-manual-review-aside [serviceEnabled]="serviceEnabled" />
    </div>
  </div>
</main>

@if (decision(); as pending) {
  <app-manual-review-decision
    [order]="pending.order"
    [action]="pending.action"
    [busy]="store.reviewing() === pending.order.id"
    (submitted)="submitDecision($event)"
    (dismissed)="decision.set(null)"
  />
}
