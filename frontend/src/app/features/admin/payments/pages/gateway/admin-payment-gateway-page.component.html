<main class="workspace-page">
  <div class="page-container">
    <app-breadcrumb [items]="breadcrumbs" />

    <app-page-heading
      title="Đối soát và hoàn tiền"
      description="Kiểm tra giao dịch với cổng thanh toán và xử lý hoàn tiền cho người dùng."
      icon="wallet"
    >
      <div class="ops-actions">
        <app-button
          variant="secondary"
          type="button"
          [loading]="store.loading()"
          (click)="store.load()"
        >
          Làm mới
        </app-button>
        <a class="ops-link-action" routerLink="/admin/settings/payments">Thiết lập nhà cung cấp</a>
        <app-button
          variant="primary"
          type="button"
          [disabled]="!store.hasRows()"
          (click)="exportCsv()"
        >
          Xuất báo cáo
        </app-button>
      </div>
    </app-page-heading>

    @if (store.error(); as error) {
      <app-error-alert [message]="error" (retry)="store.load()" />
    }
    @if (store.notice(); as notice) {
      <p class="ops-notice" role="status">{{ notice }}</p>
    }

    <div class="ops-stat-grid">
      @for (stat of stats(); track stat.label) {
        <app-stat-card
          [label]="stat.label"
          [value]="stat.value"
          [icon]="stat.icon"
          [tone]="stat.tone"
        >
          <span statMeta class="ops-stat-meta">{{ stat.meta }}</span>
        </app-stat-card>
      }
    </div>

    <div class="ops-layout">
      <div class="ops-stack">
        <app-gateway-filters
          [value]="store.filters()"
          [busy]="store.loading()"
          (applied)="applyFilters($event)"
          (cleared)="store.resetFilters()"
        />

        <div class="gw-tabs" role="tablist" aria-label="Lọc nhanh theo trạng thái">
          @for (tab of tabs; track tab.id) {
            <button
              type="button"
              role="tab"
              class="gw-tab"
              [class.gw-tab--active]="store.tab() === tab.id"
              [attr.aria-selected]="store.tab() === tab.id"
              (click)="store.selectTab(tab.id)"
            >
              {{ tab.label }}
              @if (tab.id === 'attention' && store.attentionCount()) {
                <span class="gw-tab__count">{{ store.attentionCount() }}</span>
              }
            </button>
          }
        </div>

        <app-gateway-order-table
          [orders]="store.orders()"
          [loading]="store.loading()"
          [busyOrderId]="store.busyOrderId()"
          [canReconcile]="canReconcile()"
          [canRefund]="canRefund()"
          [page]="store.page()"
          [totalPages]="store.totalPages()"
          [pageSize]="store.pageSize()"
          [totalItems]="store.totalItems()"
          (acted)="act($event)"
          (pageChanged)="store.goToPage($event)"
          (pageSizeChanged)="store.changePageSize($event)"
        />
      </div>

      <app-gateway-aside />
    </div>
  </div>
</main>

@if (pending(); as request) {
  <app-gateway-refund-dialog
    [order]="request.order"
    [automated]="request.action === 'refund'"
    [busy]="store.busyOrderId() === request.order.id"
    (submitted)="submitRefund($event)"
    (dismissed)="pending.set(null)"
  />
}
