<main class="admin-page">
  <div class="page-container">
    <app-breadcrumb [items]="breadcrumbs" />
    <app-page-heading
      title="Quản lý người dùng"
      description="Tìm kiếm, kiểm tra trạng thái tài khoản và quản lý quyền quản trị."
      icon="users"
    />
    <section class="card">
      <app-admin-users-filters
        [keyword]="store.keyword()"
        [status]="store.statusFilter()"
        [role]="store.roleFilter()"
        [statusOptions]="statusOptions"
        (keywordChange)="store.setKeyword($event)"
        (statusChange)="store.setStatusFilter($event)"
        (roleChange)="store.setRoleFilter($event)"
        (searchRequested)="store.search()"
      />
      @if (store.error()) {
        <div class="state">
          <app-error-alert
            title="Không thể tải người dùng"
            [message]="store.error()"
            (retry)="store.load()"
          />
        </div>
      }
      @if (store.loading() && store.users().length === 0) {
        <app-loading-state message="Đang tải người dùng..." />
      } @else if (store.users().length === 0 && !store.error()) {
        <app-empty-state
          icon="users"
          title="Không tìm thấy người dùng"
          description="Không có tài khoản phù hợp với bộ lọc hiện tại."
        />
      } @else {
        <app-admin-users-table
          [users]="store.users()"
          [total]="store.total()"
          [page]="store.page()"
          [totalPages]="store.totalPages()"
          (pageChange)="store.setPage($event)"
        />
      }
    </section>
  </div>
</main>
