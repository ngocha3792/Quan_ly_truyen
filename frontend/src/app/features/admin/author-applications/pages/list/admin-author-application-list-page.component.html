<main class="workspace-page">
  <div class="page-container">
    <app-breadcrumb [items]="breadcrumbs" /><app-page-heading
      title="Xét duyệt hồ sơ tác giả"
      description="Quản lý và xét duyệt các yêu cầu trở thành tác giả trên hệ thống."
      icon="shield"
    />
    <section class="list-card">
      <app-admin-author-application-filters
        [keyword]="store.keyword()"
        [status]="store.statusFilter()"
        [total]="store.total()"
        [statusOptions]="statusOptions"
        (keywordChange)="store.setKeyword($event)"
        (statusChange)="store.setStatusFilter($event)"
        (searchRequested)="store.search()"
      />
      @if (store.error()) {
        <div class="list-card__state">
          <app-error-alert
            title="Không thể tải danh sách hồ sơ"
            [message]="store.error()"
            (retry)="store.load()"
          />
        </div>
      }
      @if (store.status() === 'loading' && store.applications().length === 0) {
        <app-loading-state message="Đang tải danh sách hồ sơ..." />
      } @else if (store.applications().length === 0 && store.status() !== 'error') {
        <app-empty-state
          icon="users"
          title="Không có hồ sơ phù hợp"
          description="Không tìm thấy hồ sơ tác giả theo bộ lọc hiện tại."
        />
      } @else if (store.applications().length > 0) {
        <app-admin-author-application-table [applications]="store.applications()" />
        <footer class="list-card__pagination">
          <span>Trang {{ store.page() }} / {{ store.totalPages() }}</span
          ><app-pagination
            [page]="store.page()"
            [totalPages]="store.totalPages()"
            (pageChange)="store.setPage($event)"
          />
        </footer>
      }
    </section>
  </div>
</main>
