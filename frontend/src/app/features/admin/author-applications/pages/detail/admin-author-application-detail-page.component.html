<main class="workspace-page">
  <div class="page-container">
    <app-breadcrumb [items]="breadcrumbs" /><app-page-heading
      title="Chi tiết hồ sơ tác giả"
      description="Kiểm tra thông tin, mẫu nội dung và quyết định xét duyệt hồ sơ."
      icon="shield"
      ><a class="back-button" routerLink="/admin/author-applications"
        >← Danh sách hồ sơ</a
      ></app-page-heading
    >
    @if (detailStore.status() === 'loading') {
      <app-loading-state message="Đang tải hồ sơ..." />
    } @else if (detailStore.error()) {
      <app-error-alert
        title="Không thể tải hồ sơ"
        [message]="detailStore.error()"
        (retry)="detailStore.load(applicationId)"
      />
    } @else if (detailStore.detail(); as application) {
      @if (actionsStore.message()) {
        <app-notice kind="success" [message]="actionsStore.message()" />
      }
      @if (actionsStore.error()) {
        <app-notice kind="error" [message]="actionsStore.error()" />
      }
      <app-admin-author-application-review-header
        [application]="application"
        [reviewing]="actionsStore.isReviewing()"
        (approve)="openApproveDialog()"
        (reject)="openRejectDialog()"
      />
      <app-admin-author-application-summary [application]="application" />
      @if (approveDialogOpen()) {
        <app-admin-author-application-approve-dialog
          [penName]="application.penName"
          [loading]="actionsStore.status() === 'approving'"
          (cancel)="closeApproveDialog()"
          (confirm)="handleApprove()"
        />
      }
      @if (rejectDialogOpen()) {
        <app-admin-author-application-reject-dialog
          [loading]="actionsStore.status() === 'rejecting'"
          (cancel)="closeRejectDialog()"
          (confirm)="handleReject($event)"
        />
      }
    }
  </div>
</main>
