<section class="review-header">
  <div>
    <div class="heading">
      <h2>{{ application.penName || 'Chưa có bút danh' }}</h2>
      <app-admin-author-application-status-badge [status]="application.status" />
    </div>
    <p>Mã hồ sơ: {{ application.applicationId }}</p>
  </div>
  @if (application.status === 'PENDING') {
    <div class="actions">
      <app-button variant="danger" [disabled]="reviewing" (click)="reject.emit()"
        >Từ chối</app-button
      >
      <app-button variant="primary" [disabled]="reviewing" (click)="approve.emit()"
        >Duyệt hồ sơ</app-button
      >
    </div>
  }
</section>
