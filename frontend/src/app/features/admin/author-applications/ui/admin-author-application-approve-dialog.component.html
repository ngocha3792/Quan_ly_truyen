<app-dialog-shell
  [open]="true"
  [busy]="loading()"
  title="Duyệt hồ sơ tác giả?"
  dialogTitleId="approve-dialog-title"
  (closed)="handleCancel()"
>
  <div class="approve-content">
    <div class="dialog-icon">✓</div>

    <p>Tài khoản này sẽ nhận quyền tác giả và có thể truy cập Author Studio.</p>

    @if (penName()) {
      <div class="pen-name">
        Bút danh:
        <strong>
          {{ penName() }}
        </strong>
      </div>
    }

    <footer>
      <app-button variant="secondary" [disabled]="loading()" (click)="cancel.emit()">
        Hủy
      </app-button>

      <app-button variant="primary" [disabled]="loading()" (click)="confirm.emit()">
        {{ loading() ? 'Đang duyệt...' : 'Duyệt hồ sơ' }}
      </app-button>
    </footer>
  </div>
</app-dialog-shell>
