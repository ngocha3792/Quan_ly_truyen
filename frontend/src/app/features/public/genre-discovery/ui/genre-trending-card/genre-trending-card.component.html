<section class="trending-card">
  <h2>Thể loại được đọc nhiều</h2>

  <div class="trending-list">
    @for (item of items(); track item.id) {
      <a
        class="trending-item"
        [routerLink]="['/danh-sach']"
        [queryParams]="{
          genre: item.slug,
          sort: 'popular',
        }"
      >
        @if (item.coverUrl) {
          <img [src]="item.coverUrl" [alt]="item.name" loading="lazy" />
        } @else {
          <span class="cover-placeholder" aria-hidden="true">{{ item.name.slice(0, 1) }}</span>
        }

        <div>
          <strong>{{ item.name }}</strong>

          <span class="progress">
            <span [attr.data-tone]="item.tone" [style.width.%]="item.percent"></span>
          </span>
        </div>

        <small> {{ item.percent | number: '1.1-1' }}% </small>
      </a>
    }
  </div>

  <a class="statistics-link" routerLink="/xep-hang"> Xem chi tiết thống kê </a>
</section>
