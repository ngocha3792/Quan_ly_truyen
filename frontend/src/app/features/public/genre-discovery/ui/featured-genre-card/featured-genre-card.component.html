<a
  class="featured-card"
  [attr.data-tone]="genre().tone"
  [routerLink]="['/danh-sach']"
  [queryParams]="{
    genre: genre().slug,
    sort: 'popular',
  }"
>
  @if (genre().coverUrl) {
    <img [src]="genre().coverUrl" [alt]="genre().name" loading="lazy" />
  }

  <div class="card-overlay"></div>

  <div class="card-content">
    <app-genre-icon [visual]="genre().visual" [tone]="genre().tone" />

    <h3>{{ genre().name }}</h3>

    <p>{{ genre().description }}</p>

    <span class="story-count">
      <app-icon name="book" [size]="13" />

      {{ genre().storyCount | compactNumber }}
      truyện
    </span>
  </div>
</a>
