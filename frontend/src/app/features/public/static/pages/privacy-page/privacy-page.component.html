<app-legal-page-shell>
  <app-legal-page-header
    header
    badge="QUYỀN RIÊNG TƯ"
    title="Chính sách quyền riêng tư"
    description="Chúng tôi cam kết bảo vệ quyền riêng tư của bạn khi sử dụng dịch vụ của TruyenHub."
    updatedAt="2025-05-01"
  >
    <svg
      icon
      viewBox="0 0 24 24"
      width="32"
      height="32"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M12 3 4.5 6v5.4c0 4.6 3 7.9 7.5 9.6 4.5-1.7 7.5-5 7.5-9.6V6L12 3Z"></path>
      <rect x="9" y="10" width="6" height="5" rx="1"></rect>
      <path d="M10.5 10V8.8a1.5 1.5 0 0 1 3 0V10"></path>
    </svg>
  </app-legal-page-header>

  <ng-container sections>
    <app-legal-section-item
      [number]="1"
      title="Thông tin chúng tôi thu thập"
      description="Chúng tôi thu thập thông tin bạn cung cấp khi đăng ký, sử dụng dịch vụ và một số thông tin kỹ thuật như thiết bị, trình duyệt và địa chỉ IP."
    />
    <app-legal-section-item
      [number]="2"
      title="Mục đích sử dụng thông tin"
      description="Thông tin của bạn được sử dụng để cung cấp, cải thiện dịch vụ, cá nhân hóa trải nghiệm và hỗ trợ khách hàng."
    />
    <app-legal-section-item
      [number]="3"
      title="Chia sẻ thông tin"
      description="Chúng tôi không bán, cho thuê hoặc chia sẻ thông tin cá nhân của bạn với bên thứ ba, trừ trường hợp pháp luật yêu cầu hoặc cần thiết để vận hành dịch vụ."
    />
    <app-legal-section-item
      [number]="4"
      title="Bảo mật thông tin"
      description="Chúng tôi áp dụng các biện pháp kỹ thuật và tổ chức phù hợp nhằm bảo vệ thông tin của bạn khỏi truy cập, thay đổi hoặc tiết lộ trái phép."
    />
    <app-legal-section-item
      [number]="5"
      title="Cookie và công nghệ tương tự"
      description="TruyenHub sử dụng cookie và các công nghệ tương tự để duy trì phiên đăng nhập, ghi nhớ tùy chọn, cải thiện trải nghiệm và phân tích lưu lượng truy cập."
    />
    <app-legal-section-item
      [number]="6"
      title="Quyền của bạn"
      description="Bạn có quyền truy cập, chỉnh sửa hoặc yêu cầu xóa thông tin cá nhân của mình theo quy định và phạm vi pháp luật hiện hành."
    />
    <app-legal-section-item
      [number]="7"
      title="Thay đổi chính sách"
      description="Chúng tôi có thể cập nhật chính sách quyền riêng tư để phù hợp với hoạt động dịch vụ và sẽ thông báo khi có thay đổi quan trọng."
    />
  </ng-container>

  <app-legal-support-cta
    support
    title="Cần hỗ trợ hoặc có thắc mắc?"
    description="Liên hệ với chúng tôi để được giải đáp và hỗ trợ nhanh nhất."
  />
</app-legal-page-shell>
