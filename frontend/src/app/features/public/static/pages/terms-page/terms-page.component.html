<app-legal-page-shell>
  <app-legal-page-header
    header
    badge="ĐIỀU KHOẢN"
    title="Điều khoản sử dụng"
    description="Vui lòng đọc kỹ các điều khoản trước khi sử dụng dịch vụ của TruyenHub."
    updatedAt="2025-05-01"
  >
    <svg
      icon
      viewBox="0 0 24 24"
      width="32"
      height="32"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M9 5.5V4a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2"></path>
      <rect x="4" y="5" width="12" height="17" rx="2"></rect>
      <path d="M7.5 9h5"></path>
      <path d="M7.5 13h5"></path>
      <path d="M7.5 17h3.5"></path>
    </svg>
  </app-legal-page-header>

  <ng-container sections>
    <app-legal-section-item
      [number]="1"
      title="Chấp nhận điều khoản"
      description="Khi truy cập và sử dụng TruyenHub, bạn đồng ý tuân thủ và bị ràng buộc bởi các điều khoản này."
    />
    <app-legal-section-item
      [number]="2"
      title="Tài khoản người dùng"
      description="Bạn chịu trách nhiệm bảo mật tài khoản và mọi hoạt động diễn ra dưới tài khoản của bạn."
    />
    <app-legal-section-item
      [number]="3"
      title="Nội dung và bản quyền"
      description="Tất cả nội dung trên TruyenHub chỉ dành cho mục đích đọc cá nhân, không được sao chép hoặc phân phối trái phép."
    />
    <app-legal-section-item
      [number]="4"
      title="Hành vi bị cấm"
      description="Nghiêm cấm các hành vi vi phạm pháp luật, lạm dụng hệ thống, đăng tải nội dung độc hại hoặc vi phạm bản quyền."
    />
    <app-legal-section-item
      [number]="5"
      title="Miễn trừ trách nhiệm"
      description="TruyenHub không đảm bảo dịch vụ không gián đoạn hoặc không có lỗi. Chúng tôi không chịu trách nhiệm cho các thiệt hại phát sinh ngoài phạm vi pháp luật quy định."
    />
    <app-legal-section-item
      [number]="6"
      title="Thay đổi điều khoản"
      description="Chúng tôi có thể cập nhật điều khoản bất kỳ lúc nào. Việc tiếp tục sử dụng dịch vụ đồng nghĩa với việc bạn chấp nhận các thay đổi."
    />
  </ng-container>

  <app-legal-support-cta
    support
    title="Bạn có câu hỏi?"
    description="Liên hệ với chúng tôi nếu bạn cần hỗ trợ hoặc giải đáp thắc mắc."
  />
</app-legal-page-shell>
