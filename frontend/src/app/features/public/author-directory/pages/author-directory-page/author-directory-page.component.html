<main class="author-directory-page">
  @if (store.view(); as view) {
    <div class="page-container">
      <app-breadcrumb [items]="breadcrumbs" />

      <app-page-heading
        title="Tác giả nổi bật"
        description="Khám phá những tác giả tài năng và các tác phẩm đặc sắc của họ."
      />

      <app-content-layout class="directory-layout" asideWidth="340px">
        <app-author-directory-toolbar
          main
          [query]="store.query()"
          [sort]="store.sort()"
          (queryChange)="store.setQuery($event)"
          (sortChange)="handleSortChange($event)"
        />

        <div main class="result-count">
          Tìm thấy

          <strong>
            {{ store.resultCount() }}
          </strong>

          tác giả
        </div>

        <app-author-list
          main
          [authors]="store.authors()"
          [followedAuthorIds]="store.followedAuthorIds()"
          (followToggle)="store.toggleFollow($event)"
        />

        <app-pagination
          main
          [page]="store.page()"
          [totalPages]="store.totalPages()"
          (pageChange)="store.setPage($event)"
        />

        <app-author-directory-sidebar
          aside
          [statistics]="view.statistics"
          [newAuthors]="view.newAuthors"
        />
      </app-content-layout>
    </div>
  }
</main>
