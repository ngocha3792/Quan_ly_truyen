<main class="forgot-password-page">
    <div class="page-container">
        <app-forgot-password-card [status]="store.status()" [result]="store.result()"
            [errorMessage]="store.errorMessage()" [initialEmail]="store.submittedEmail()" (resetRequested)="
        store.requestResetLink($event)
      " (retry)="store.retry()" (useAnotherEmail)="
        store.useAnotherEmail()
      " (errorCleared)="
        store.clearError()
      "></app-forgot-password-card>
    </div>
</main>
