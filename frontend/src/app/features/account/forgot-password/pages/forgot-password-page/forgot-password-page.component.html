<app-auth-flow-page-shell>
  <app-forgot-password-card
    [status]="store.status()"
    [result]="store.result()"
    [errorMessage]="store.errorMessage()"
    [initialEmail]="store.submittedEmail()"
    (resetRequested)="store.requestResetLink($event)"
    (retry)="store.retry()"
    (useAnotherEmail)="store.useAnotherEmail()"
    (errorCleared)="store.clearError()"
  />
</app-auth-flow-page-shell>
