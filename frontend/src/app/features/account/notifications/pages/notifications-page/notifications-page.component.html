<main class="notifications-page">
  <div class="page-container">
    <app-breadcrumb [items]="breadcrumbs" />

    <app-page-heading
      title="Thông báo"
      description="Xem tất cả thông báo, cập nhật và hoạt động liên quan đến tài khoản của bạn."
    />

    @if (store.error()) {
      <app-error-alert
        title="Không thể hoàn tất yêu cầu"
        [message]="store.error()"
        (retry)="store.view() ? store.clearError() : store.load()"
      />
    }

    @if (store.loading() && !store.view()) {
      <app-loading-state message="Đang tải thông báo..." />
    }

    @if (store.view(); as view) {
      <app-content-layout class="notifications-layout" asideWidth="340px">
        <app-notifications-toolbar
          main
          [query]="store.query()"
          [category]="store.category()"
          [unreadCount]="store.unreadCount()"
          (queryChange)="store.setQuery($event)"
          (categoryChange)="changeCategory($event)"
          (markAllAsRead)="store.markAllAsRead()"
        />

        <app-notifications-list
          main
          [notifications]="store.notifications()"
          (readToggle)="store.toggleRead($event)"
          (savedToggle)="store.toggleSaved($event)"
        />

        <div main class="pagination-row">
          <app-pagination
            [page]="store.page()"
            [totalPages]="store.totalPages()"
            (pageChange)="store.setPage($event)"
          />
        </div>

        <app-notifications-sidebar
          aside
          [statistics]="view.statistics"
          [settings]="store.settings()"
          [activities]="view.recentActivities"
          [unreadCount]="store.unreadCount()"
          [savedCount]="store.savedCount()"
          (settingToggle)="store.toggleSetting($event)"
        />
      </app-content-layout>
    }
  </div>
</main>
