<main class="reading-history-page">
  <div class="page-container">
    <app-breadcrumb [items]="breadcrumbs" />

    <app-page-heading
      title="Lịch sử đọc"
      description="Theo dõi tiến độ và các chương truyện bạn đã đọc gần đây."
    />

    @if (store.loading() && !store.view()) {
      <app-loading-state message="Đang tải lịch sử đọc..." />
    } @else if (store.error() && !store.view()) {
      <app-error-alert [message]="store.error()" (retry)="store.load()" />
    } @else if (store.view(); as view) {
      <app-content-layout class="history-layout" asideWidth="340px">
        <app-reading-history-toolbar
          main
          [query]="store.query()"
          [period]="store.period()"
          [sort]="store.sort()"
          (queryChange)="store.setQuery($event)"
          (periodChange)="changePeriod($event)"
          (sortChange)="changeSort($event)"
        />

        <header main class="list-heading">
          <h2>Đã đọc gần đây</h2>
          <span>Tìm thấy <strong>{{ store.resultCount() }}</strong> truyện</span>
        </header>

        <app-reading-history-list
          main
          [items]="store.filteredHistory()"
          [bookmarkedIds]="store.bookmarkedIds()"
          (bookmarkToggle)="store.toggleBookmark($event)"
        />

        <app-reading-history-sidebar
          aside
          [statistics]="view.statistics"
          [continueReading]="view.continueReading"
          [syncState]="store.syncState()"
          (clearHistory)="store.clearHistory()"
          (syncDevices)="store.syncDevices()"
        />
      </app-content-layout>
    }
  </div>
</main>
