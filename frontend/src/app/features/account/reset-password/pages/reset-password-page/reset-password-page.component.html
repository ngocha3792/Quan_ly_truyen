<app-auth-flow-page-shell>
  <app-reset-password-card
    [status]="store.status()"
    [config]="
      store.config() ?? {
        minimumLength: 8,
        maximumLength: 72,
        tokenExpiresInMinutes: 15,
      }
    "
    [tokenValidation]="store.tokenValidation()"
    [result]="store.result()"
    [errorMessage]="store.errorMessage()"
    (passwordSubmitted)="store.submit($event)"
    (retryValidation)="store.retryValidation()"
    (errorCleared)="store.clearError()"
  />
</app-auth-flow-page-shell>
