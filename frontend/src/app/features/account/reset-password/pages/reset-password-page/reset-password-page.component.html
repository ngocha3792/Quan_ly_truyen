<main class="reset-password-page">
    <div class="page-container">
        <app-reset-password-card [status]="store.status()" [config]="
        store.config() ?? {
          minimumLength: 8,
          maximumLength: 64,
          tokenExpiresInMinutes: 15
        }
      " [tokenValidation]="
        store.tokenValidation()
      " [result]="store.result()" [errorMessage]="
        store.errorMessage()
      " (passwordSubmitted)="
        store.submit($event)
      " (retryValidation)="
        store.retryValidation()
      " (errorCleared)="
        store.clearError()
      "></app-reset-password-card>
    </div>
</main>
