<app-security-feature-shell
  title="Đổi mật khẩu"
  description="Sử dụng mật khẩu mạnh mà bạn chưa từng sử dụng cho tài khoản này."
>
  <div security-main>
    @if (store.error()) {
      <div class="alert error">
        {{ store.error() }}
      </div>
    }

    @if (store.success()) {
      <div class="alert success">
        {{ store.success() }}
      </div>
    }

    <app-security-panel
      title="Mật khẩu mới"
      description="Mật khẩu tối thiểu {{ passwordPolicy.minimumLength }} ký tự."
      icon="lock"
    >
      <form class="security-form" [formGroup]="form" (ngSubmit)="submit()">
        <app-account-password-input
          label="Mật khẩu hiện tại"
          icon="lock"
          autocomplete="current-password"
          placeholder="Nhập mật khẩu hiện tại"
          formControlName="currentPassword"
          [error]="currentPasswordError"
        />

        <app-account-password-input
          label="Mật khẩu mới"
          icon="key"
          autocomplete="new-password"
          placeholder="Nhập mật khẩu mới"
          [maxLength]="passwordPolicy.maximumLength"
          formControlName="newPassword"
          [hint]="passwordHint"
          [error]="newPasswordError"
        />

        <app-account-password-input
          label="Xác nhận mật khẩu mới"
          icon="check"
          autocomplete="new-password"
          placeholder="Nhập lại mật khẩu mới"
          [maxLength]="passwordPolicy.maximumLength"
          formControlName="confirmPassword"
          [error]="confirmPasswordError"
        />

        <div class="form-actions">
          <button
            class="primary-button"
            type="submit"
            [disabled]="form.invalid || store.submitting()"
          >
            {{ store.submitting() ? 'Đang xử lý...' : 'Đổi mật khẩu' }}
          </button>
        </div>
      </form>
    </app-security-panel>
  </div>

  <div security-aside>
    <section class="aside-card">
      <h3>Mẹo đặt mật khẩu an toàn</h3>

      <p>Không dùng lại mật khẩu đã sử dụng ở nơi khác.</p>

      <p>Kết hợp chữ hoa, chữ thường, số và ký tự đặc biệt.</p>

      <p>Đổi mật khẩu ngay nếu bạn nghi ngờ tài khoản bị lộ.</p>
    </section>
  </div>
</app-security-feature-shell>
