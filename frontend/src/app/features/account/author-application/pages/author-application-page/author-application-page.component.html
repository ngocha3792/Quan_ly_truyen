<main class="author-application-page">
  <div class="page-container">
    <app-breadcrumb [items]="breadcrumbs" />

    <app-page-heading
      title="Gửi yêu cầu trở thành tác giả"
      description="Điền đầy đủ thông tin bên dưới để ứng tuyển và bắt đầu hành trình chia sẻ câu chuyện của bạn trên TruyenHub."
      icon="sparkles"
    />

    @if (store.config(); as config) {
      <app-content-layout class="application-layout" asideWidth="340px">
        <app-author-application-form
          main
          [config]="config"
          [submitting]="store.status() === 'submitting'"
          [draftSaving]="store.status() === 'saving-draft'"
          [successMessage]="store.message()"
          [errorMessage]="store.errorMessage()"
          (saveDraft)="handleSaveDraft($event)"
          (submitApplication)="handleSubmit($event)"
        />

        <app-author-application-sidebar
          aside
          [requirements]="config.requirements"
          [reviewSteps]="config.reviewSteps"
          [benefits]="config.benefits"
        />
      </app-content-layout>
    } @else if (store.status() === 'error') {
      <app-error-alert
        title="Không thể tải biểu mẫu"
        [message]="store.errorMessage()"
        (retry)="store.load()"
      />
    } @else {
      <app-loading-state class="application-loading" message="Đang tải biểu mẫu đăng ký..." />
    }
  </div>
</main>
