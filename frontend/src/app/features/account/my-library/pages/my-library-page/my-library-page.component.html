<main class="my-library-page">
  <div class="page-container">
    <app-breadcrumb [items]="breadcrumbs" />

    <app-page-heading
      title="Thư viện của tôi"
      description="Quản lý các truyện bạn đã lưu và đang đọc."
    />

    @if (store.loading() && !store.view()) {
      <app-loading-state message="Đang tải thư viện..." />
    } @else if (store.error() && !store.view()) {
      <app-error-alert [message]="store.error()" (retry)="store.load()" />
    } @else if (store.view(); as view) {
      <app-content-layout class="library-layout" asideWidth="340px">
        <app-library-toolbar
          main
          [query]="store.query()"
          [filter]="store.filter()"
          [sort]="store.sort()"
          [viewMode]="store.viewMode()"
          (queryChange)="store.setQuery($event)"
          (filterChange)="changeFilter($event)"
          (sortChange)="changeSort($event)"
          (viewModeChange)="changeViewMode($event)"
        />

        <div main class="result-heading">
          Có <strong>{{ store.resultCount() }}</strong> truyện trong thư viện
        </div>

        <app-library-story-list
          main
          [stories]="store.filteredStories()"
          [viewMode]="store.viewMode()"
          (favoriteToggle)="store.toggleFavorite($event)"
        />

        <app-library-sidebar
          aside
          [statistics]="store.statistics()"
          [quickItems]="view.quickItems"
          [goal]="view.goal"
        />
      </app-content-layout>
    }
  </div>
</main>
