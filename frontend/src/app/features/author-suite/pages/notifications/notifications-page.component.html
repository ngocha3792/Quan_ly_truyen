<article class="panel page compact" appCard>
  <div class="toolbar">
    <div class="tabs">
      @for (tab of ['Tất cả', 'Hệ thống', 'Tương tác', 'Thanh toán']; track tab) {
        <button [class.active]="activeTab() === tab" (click)="activeTab.set(tab)" appButton>
          {{ tab }}
        </button>
      }
    </div>
    <button appButton>Đánh dấu tất cả đã đọc</button>
  </div>
  <div class="notices">
    @for (n of notices; track n[0]) {
      <div>
        <i [class]="n[3]">●</i
        ><span
          ><b>{{ n[0] }}</b
          ><small>{{ n[1] }}</small></span
        ><time>{{ n[2] }}</time>
      </div>
    }
  </div>
</article>
