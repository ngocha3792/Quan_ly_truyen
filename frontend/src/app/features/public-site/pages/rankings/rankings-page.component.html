<section class="page-shell ranking-layout">
  <aside class="left-menu">
    <h2>Xếp hạng</h2>
    @for (
      tab of ['Tổng hợp', 'Lượt xem', 'Đánh giá', 'Yêu thích', 'Bình luận', 'Doanh thu'];
      track tab
    ) {
      <button [class.active]="activeRanking() === tab" (click)="activeRanking.set(tab)" appButton>
        {{ tab }}
      </button>
    }
  </aside>
  <article class="panel ranking-page" appCard>
    <div class="ranking-period">
      <button class="active" appButton>Ngày</button><button appButton>Tuần</button
      ><button appButton>Tháng</button><button appButton>Tổng</button>
    </div>
    <div class="ranking-list">
      @for (story of stories; track story.id; let i = $index) {
        <a [routerLink]="['/story', story.id === 1 ? 'dai-dao-chi-ton' : 'truyen-' + story.id]"
          ><b>{{ i + 1 }}</b
          ><img [src]="story.image" [alt]="story.title" />
          <div>
            <strong>{{ story.title }}</strong
            ><small>{{ story.author }} · {{ story.chapter }}</small>
          </div>
          <span><app-public-site-icon name="eye" />{{ story.reads }}</span></a
        >
      }
    </div>
  </article>
</section>
