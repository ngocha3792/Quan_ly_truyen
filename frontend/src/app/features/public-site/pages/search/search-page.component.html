<section class="page-shell search-layout">
  <aside class="panel search-filters">
    <h2>Bộ lọc</h2>
    <label
      ><span>Thể loại</span
      ><select>
        <option>Tất cả</option>
        <option>Tiên hiệp</option>
        <option>Huyền huyễn</option>
      </select></label
    ><label
      ><span>Trạng thái</span
      ><select>
        <option>Tất cả</option>
        <option>Đang ra</option>
        <option>Hoàn thành</option>
      </select></label
    ><label
      ><span>Sắp xếp</span
      ><select>
        <option>Liên quan nhất</option>
        <option>Lượt xem</option>
        <option>Đánh giá cao</option>
      </select></label
    >
  </aside>
  <article class="panel search-results" appCard>
    <label class="search-box"
      ><app-public-site-icon name="search" /><input value="đại đạo chí tôn" /><button appButton>
        <app-public-site-icon name="x" /></button
    ></label>
    <h1>Kết quả tìm kiếm cho: “đại đạo chí tôn” <small>(12 kết quả)</small></h1>
    <div class="result-list">
      @for (story of stories.slice(0, 3); track story.id) {
        <a [routerLink]="['/story', story.id === 1 ? 'dai-dao-chi-ton' : 'truyen-' + story.id]"
          ><img [src]="story.image" [alt]="story.title" />
          <div>
            <strong>{{ story.title }}</strong>
            <p>{{ story.author }} · {{ story.status }}</p>
            <small>{{ story.chapter }} · ★ {{ story.rating }} · {{ story.reads }}</small>
          </div></a
        >
      }
    </div>
  </article>
</section>
