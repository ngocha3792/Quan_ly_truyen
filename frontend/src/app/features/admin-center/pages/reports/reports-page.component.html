<article class="admin-panel page-panel" appCard>
  <div class="table-toolbar">
    <div class="tabs">
      @for (tab of ['Tất cả', 'Chờ xử lý', 'Đang xử lý', 'Đã xử lý']; track tab) {
        <button [class.active]="activeTab() === tab" (click)="activeTab.set(tab)" appButton>
          {{ tab }}
        </button>
      }
    </div>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table" appDataTable>
      <thead>
        <tr>
          <th>#</th>
          <th>Loại báo cáo</th>
          <th>Nội dung</th>
          <th>Người báo cáo</th>
          <th>Ngày báo cáo</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        @for (item of reports; track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.object }}</td>
            <td>
              <strong>{{ item.content }}</strong>
            </td>
            <td>{{ item.user }}</td>
            <td>{{ item.date }}</td>
            <td>
              <span [class]="'status status--' + item.tone">{{ item.status }}</span>
            </td>
            <td>
              <div class="row-actions">
                <button appButton><app-admin-center-icon name="edit" /></button
                ><button class="danger" appButton><app-admin-center-icon name="trash" /></button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</article>
