<article class="admin-panel page-panel narrow-page" appCard>
  <div class="filter-row">
    <label
      ><app-admin-center-icon name="search" /><input
        type="search"
        placeholder="Tìm danh mục..." /></label
    ><button class="primary-action" appButton>
      <app-admin-center-icon name="plus" />Thêm danh mục
    </button>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table" appDataTable>
      <thead>
        <tr>
          <th>#</th>
          <th>Tên danh mục</th>
          <th>Số truyện</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        @for (item of categories; track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td>
              <strong>{{ item.name }}</strong>
            </td>
            <td>{{ item.count }}</td>
            <td>
              <span [class]="'status status--' + item.tone">{{ item.status }}</span>
            </td>
            <td>
              <div class="row-actions">
                <button appButton><app-admin-center-icon name="edit" /></button
                ><button class="danger" appButton><app-admin-center-icon name="trash" /></button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</article>
