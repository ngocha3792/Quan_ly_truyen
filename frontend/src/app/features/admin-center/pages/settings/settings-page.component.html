<article class="admin-panel settings-panel" appCard>
  <div class="settings-tabs">
    @for (tab of ['Thông tin chung', 'Email', 'Thanh toán', 'Bảo mật', 'SEO', 'Khác']; track tab) {
      <button [class.active]="settingsTab() === tab" (click)="settingsTab.set(tab)" appButton>
        {{ tab }}
      </button>
    }
  </div>
  <form (submit)="$event.preventDefault()">
    <div class="settings-form-grid">
      <label><span>Tên website</span><input type="text" value="QuanLyTruyen" /></label>
      <label><span>Email liên hệ</span><input type="email" value="admin@quanlytruyen.com" /></label>
      <label class="wide"
        ><span>Mô tả website</span
        ><textarea>Đọc truyện chữ online hay nhất, cập nhật nhanh chóng</textarea>
      </label>
      <label><span>Số điện thoại</span><input type="text" value="0123 456 789" /></label>
      <label
        ><span>Logo</span><button type="button" class="upload-button" appButton>Chọn file</button
        ><img class="logo-preview" src="/assets/admin-center/logo-preview.svg" alt="Logo"
      /></label>
      <label><span>Địa chỉ</span><input type="text" value="Hà Nội, Việt Nam" /></label>
      <label
        ><span>Favicon</span><button type="button" class="upload-button" appButton>Chọn file</button
        ><img class="favicon-preview" src="/assets/admin-center/favicon-preview.svg" alt="Favicon"
      /></label>
      <label
        ><span>Copyright</span><input type="text" value="© 2024 QuanLyTruyen. All rights reserved."
      /></label>
    </div>
    <button class="primary-action save-button" type="submit" appButton>Lưu thay đổi</button>
  </form>
</article>
