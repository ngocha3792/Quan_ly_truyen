<div
  appAutoTranslate
  class="workspace-layout"
  [class.admin-center]="variant === 'admin'"
  [class.suite]="variant === 'author'"
  [class.account-center]="variant === 'account'"
  [attr.data-workspace]="variant"
>
  <button
    appButton
    class="workspace-overlay"
    type="button"
    aria-label="Đóng menu"
    [class.visible]="sidebarOpen()"
    (click)="closeSidebar()"
  ></button>

  <aside class="workspace-sidebar" [class.open]="sidebarOpen()">
    <div class="workspace-sidebar__head">
      <a class="workspace-brand" [routerLink]="navigation[0]?.route || '/'" (click)="closeSidebar()">
        <app-logo [caption]="brandCaption" />
      </a>
      <button appButton variant="ghost" class="workspace-sidebar__close" type="button" aria-label="Đóng menu" (click)="closeSidebar()">×</button>
    </div>

    <div class="workspace-sidebar__label">Không gian làm việc</div>
    <nav class="workspace-navigation" aria-label="Điều hướng chức năng">
      @for (item of navigation; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          (click)="closeSidebar()"
        >
          <span class="workspace-navigation__icon" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
          <span class="workspace-navigation__arrow" aria-hidden="true">›</span>
        </a>
      }
    </nav>

    @if (primaryActionLabel && primaryActionRoute) {
      <a
        appButton
        variant="primary"
        class="workspace-primary-action"
        [routerLink]="primaryActionRoute"
        (click)="closeSidebar()"
      >
        <span aria-hidden="true">＋</span>{{ primaryActionLabel }}
      </a>
    }

    <div class="workspace-sidebar__spacer"></div>

    <a class="workspace-back-home" routerLink="/">
      <span aria-hidden="true">↗</span><span>Về trang đọc truyện</span>
    </a>

    <div class="workspace-user-card">
      <app-avatar [src]="avatarSrc" [name]="userName" />
      <span>
        <strong>{{ userName }}</strong>
        <small>{{ userRole }}</small>
      </span>
      <span aria-hidden="true">•••</span>
    </div>
  </aside>

  <main class="workspace-main">
    <header class="workspace-topbar">
      <button
        appButton
        variant="ghost"
        class="workspace-menu"
        type="button"
        aria-label="Mở menu"
        (click)="toggleSidebar()"
      >
        <span></span><span></span><span></span>
      </button>

      <app-page-header [title]="routeMeta().title" [description]="routeMeta().description" />

      <div class="workspace-topbar__actions">
        <app-search-box [placeholder]="searchPlaceholder" />
        <app-preferences-control />
        <button appButton variant="ghost" class="workspace-notification" type="button" aria-label="Thông báo">
          <span aria-hidden="true">♢</span>
          @if (notificationCount > 0) {
            <span class="workspace-notification__badge">{{ notificationCount }}</span>
          }
        </button>
        <button appButton variant="ghost" class="workspace-account" type="button">
          <app-avatar size="sm" [src]="avatarSrc" [name]="userName" />
          <span>{{ userName }}</span>
          <span aria-hidden="true">⌄</span>
        </button>
      </div>
    </header>

    <section class="workspace-content"><router-outlet /></section>
  </main>
</div>
