<article class="legal-item">
  <span class="legal-number">{{ number() }}</span>

  <div class="legal-content">
    <h2>{{ title() }}</h2>

    <p>{{ description() }}</p>
  </div>

  <span class="legal-chevron" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path d="m8 10 4 4 4-4" />
    </svg>
  </span>
</article>
