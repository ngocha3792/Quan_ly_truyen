server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ------------------------------------------------------------
    # Fingerprinted assets
    #
    # Ví dụ:
    #   main-A7BC91F2.js
    #   styles-3D91CA82.css
    #   chunk-7F2BA001.js
    #
    # Chỉ những file js/css có hash >= 8 ký tự trước extension
    # mới được cache lâu + immutable.
    # ------------------------------------------------------------
    location ~* ^/.+[-.][a-z0-9_-]{8,}\.(?:js|css)$ {
        try_files $uri =404;

        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------
    # Non-fingerprinted static assets
    #
    # Ví dụ:
    #   logo.svg
    #   favicon.ico
    #   background.webp
    #   fonts/inter.woff2
    #
    # Không immutable vì nội dung có thể đổi nhưng URL giữ nguyên.
    # ------------------------------------------------------------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|otf)$ {
        try_files $uri =404;

        expires 1h;

        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # ------------------------------------------------------------
    # index.html phải luôn được kiểm tra lại.
    #
    # File này tham chiếu tới tên bundle fingerprint mới sau deploy,
    # nên tuyệt đối không cache lâu.
    # ------------------------------------------------------------
    location = /index.html {
        expires -1;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ------------------------------------------------------------
    # Angular SPA fallback
    # ------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}