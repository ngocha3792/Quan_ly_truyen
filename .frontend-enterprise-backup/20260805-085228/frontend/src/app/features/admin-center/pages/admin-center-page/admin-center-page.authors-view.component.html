<article class="admin-panel page-panel">
  <div class="filter-row">
    <label
      ><app-admin-center-icon name="search" /><input
        type="search"
        placeholder="Tìm kiếm tác giả..." /></label
    ><button class="primary-action"><app-admin-center-icon name="plus" />Thêm tác giả</button>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Avatar</th>
          <th>Tên tác giả</th>
          <th>Email</th>
          <th>Truyện</th>
          <th>Người theo dõi</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        @for (author of authors; track author.id) {
          <tr>
            <td>{{ author.id }}</td>
            <td><img class="table-avatar" [src]="author.avatar" [alt]="author.name" /></td>
            <td>
              <strong>{{ author.name }}</strong>
            </td>
            <td>{{ author.email }}</td>
            <td>{{ author.role }}</td>
            <td>{{ author.count }}</td>
            <td>
              <span [class]="'status status--' + author.tone">{{ author.status }}</span>
            </td>
            <td>
              <div class="row-actions">
                <button><app-admin-center-icon name="edit" /></button
                ><button><app-admin-center-icon name="eye" /></button
                ><button class="danger"><app-admin-center-icon name="trash" /></button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</article>
