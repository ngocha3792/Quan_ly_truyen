<article class="admin-panel page-panel">
  <div class="filter-row">
    <label
      ><app-admin-center-icon name="search" /><input type="search" placeholder="Tìm kiếm chương..."
    /></label>
    <div>
      <button><app-admin-center-icon name="filter" />Bộ lọc</button
      ><button class="primary-action"><app-admin-center-icon name="plus" />Thêm chương</button>
    </div>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Tên chương</th>
          <th>Số từ</th>
          <th>Lượt đọc</th>
          <th>Ngày đăng</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody>
        @for (chapter of chapters; track chapter.id) {
          <tr>
            <td>{{ chapter.id }}</td>
            <td>
              <strong>Chương {{ chapter.id }}: {{ chapter.title }}</strong>
            </td>
            <td>{{ chapter.words }}</td>
            <td>{{ chapter.views }}</td>
            <td>{{ chapter.date }}</td>
            <td><span class="status status--green">Đã duyệt</span></td>
            <td>
              <div class="row-actions">
                <button><app-admin-center-icon name="edit" /></button
                ><button><app-admin-center-icon name="eye" /></button
                ><button class="danger"><app-admin-center-icon name="trash" /></button>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="pagination">
    <button class="active">1</button><button>2</button><button>3</button><button>4</button
    ><button>5</button><button>›</button>
  </div>
</article>
