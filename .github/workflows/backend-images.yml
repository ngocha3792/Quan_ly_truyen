name: Publish Backend Images

on:
  workflow_dispatch:

  push:
    tags:
      - "backend-v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact SHA passed required CI

    permissions:
      actions: read
      contents: read

    runs-on: ubuntu-latest

    timeout-minutes: 10

    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      ci_run_url: ${{ steps.required-ci.outputs.run_url }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

        with:
          fetch-depth: 1

      - name: Resolve immutable release SHA
        id: source

        shell: bash

        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"

          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve a full Git commit SHA from the release source."

            exit 1
          fi

          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

          echo "Release source SHA: ${source_sha}"

      - name: Require successful CI for exact SHA on main
        id: required-ci

        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

          SOURCE_SHA: ${{ steps.source.outputs.sha }}

        run: |
          set -euo pipefail

          runs_json="$(
            gh api \
              --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="${SOURCE_SHA}" \
              -f per_page=100
          )"

          successful_run="$(
            jq -c \
              --arg sha "${SOURCE_SHA}" \
              '[
                .workflow_runs[]
                | select(.head_sha == $sha)
                | select(.event == "push")
                | select(.head_branch == "main")
                | select(.status == "completed")
                | select(.conclusion == "success")
              ]
              | sort_by(.run_number)
              | reverse
              | .[0] // empty' \
              <<<"${runs_json}"
          )"

          if test -z "${successful_run}"; then
            echo "No successful CI workflow run was found for exact SHA ${SOURCE_SHA} on main."

            echo

            echo "Known CI runs for this SHA:"

            jq -r \
              --arg sha "${SOURCE_SHA}" \
              '.workflow_runs[]
                | select(.head_sha == $sha)
                | "- run #\(.run_number): event=\(.event), branch=\(.head_branch // ""), status=\(.status), conclusion=\(.conclusion // "pending"), url=\(.html_url)"' \
              <<<"${runs_json}" || true

            echo

            echo "Backend images will not be published until the exact commit has passed full CI on main."

            exit 1
          fi

          run_url="$(
            jq -r \
              '.html_url' \
              <<<"${successful_run}"
          )"

          run_number="$(
            jq -r \
              '.run_number' \
              <<<"${successful_run}"
          )"

          echo "Verified CI run #${run_number}: ${run_url}"

          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"

          {
            echo "## Backend release verification"

            echo

            echo "- Source SHA: \`${SOURCE_SHA}\`"

            echo "- Required CI run: [#${run_number}](${run_url})"

            echo "- Result: successful full CI on \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Scan and publish verified backend images

    needs:
      - verify

    permissions:
      contents: read
      packages: write
      id-token: write

    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:
      - name: Checkout verified source SHA
        uses: actions/checkout@v6

        with:
          ref: ${{ needs.verify.outputs.source_sha }}

          fetch-depth: 1

      - name: Verify checkout did not drift
        shell: bash

        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.source_sha }}

        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          if test "${actual_sha}" != "${EXPECTED_SHA}"; then
            echo "Release source drift detected."

            echo "Expected: ${EXPECTED_SHA}"

            echo "Actual:   ${actual_sha}"

            exit 1
          fi

          echo "Verified immutable release checkout: ${actual_sha}"

      - name: Set image coordinates
        id: image

        shell: bash

        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}

        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"

          echo "runtime=ghcr.io/${owner}/quan-ly-truyen-backend" >> "$GITHUB_OUTPUT"

          echo "migrate=ghcr.io/${owner}/quan-ly-truyen-backend-migrate" >> "$GITHUB_OUTPUT"

          echo "tag=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # Security build + scan
      # ------------------------------------------------------------

      - name: Build runtime image for security scan
        uses: docker/build-push-action@v6

        with:
          context: backend

          file: backend/Dockerfile

          target: runtime

          load: true

          tags: quan-ly-truyen-backend:release-scan

          build-args: NODE_IMAGE=node:24.15.0-bookworm-slim

          cache-from: type=gha,scope=backend-runtime

          cache-to: type=gha,mode=max,scope=backend-runtime

      - name: Scan runtime image before publish
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: quan-ly-truyen-backend:release-scan

          format: table

          exit-code: "1"

          ignore-unfixed: true

          vuln-type: os,library

          severity: CRITICAL,HIGH

      - name: Build migration image for security scan
        uses: docker/build-push-action@v6

        with:
          context: backend

          file: backend/Dockerfile

          target: migrate

          load: true

          tags: quan-ly-truyen-backend-migrate:release-scan

          build-args: NODE_IMAGE=node:24.15.0-bookworm-slim

          cache-from: type=gha,scope=backend-migrate

          cache-to: type=gha,mode=max,scope=backend-migrate

      - name: Scan migration image before publish
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: quan-ly-truyen-backend-migrate:release-scan

          format: table

          exit-code: "1"

          ignore-unfixed: true

          vuln-type: os,library

          severity: CRITICAL,HIGH

          skip-setup-trivy: true

      # ------------------------------------------------------------
      # Nothing above this point can publish a package.
      # ------------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v4

        with:
          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6

        with:
          context: backend

          file: backend/Dockerfile

          target: runtime

          push: true

          tags: ${{ steps.image.outputs.runtime }}:${{ steps.image.outputs.tag }}

          build-args: NODE_IMAGE=node:24.15.0-bookworm-slim

          cache-from: type=gha,scope=backend-runtime

          cache-to: type=gha,mode=max,scope=backend-runtime

          provenance: mode=max

          sbom: true

      - name: Build and push migrate image
        uses: docker/build-push-action@v6

        with:
          context: backend

          file: backend/Dockerfile

          target: migrate

          push: true

          tags: ${{ steps.image.outputs.migrate }}:${{ steps.image.outputs.tag }}

          build-args: NODE_IMAGE=node:24.15.0-bookworm-slim

          cache-from: type=gha,scope=backend-migrate

          cache-to: type=gha,mode=max,scope=backend-migrate

          provenance: mode=max

          sbom: true

      - name: Deployment coordinates
        shell: bash

        run: |
          echo "BACKEND_IMAGE_NAME=${{ steps.image.outputs.runtime }}"

          echo "BACKEND_MIGRATE_IMAGE_NAME=${{ steps.image.outputs.migrate }}"

          echo "BACKEND_IMAGE_TAG=${{ steps.image.outputs.tag }}"

          echo "BACKEND_SOURCE_SHA=${{ needs.verify.outputs.source_sha }}"

          echo "BACKEND_VERIFIED_CI_RUN=${{ needs.verify.outputs.ci_run_url }}"