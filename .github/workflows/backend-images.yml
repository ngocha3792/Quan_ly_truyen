name: Publish Backend Images

on:
  workflow_dispatch:
  push:
    tags:
      - "backend-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quan_ly_truyen_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          npm install --global npm@11.12.1
          npm ci --no-audit --no-fund

      - name: Verify release source
        run: |
          npm run format:check
          npm run lint:check
          npm run typecheck:scripts
          npm run build
          npm test -- --runInBand

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image coordinates
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "runtime=ghcr.io/${owner}/quan-ly-truyen-backend" >> "$GITHUB_OUTPUT"
          echo "migrate=ghcr.io/${owner}/quan-ly-truyen-backend-migrate" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.image.outputs.runtime }}:${{ steps.image.outputs.tag }}
          build-args: NODE_IMAGE=node:24.18.0-bookworm-slim
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,mode=max,scope=backend-runtime
          provenance: mode=max
          sbom: true

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: migrate
          push: true
          tags: ${{ steps.image.outputs.migrate }}:${{ steps.image.outputs.tag }}
          build-args: NODE_IMAGE=node:24.18.0-bookworm-slim
          cache-from: type=gha,scope=backend-migrate
          cache-to: type=gha,mode=max,scope=backend-migrate
          provenance: mode=max
          sbom: true

      - name: Deployment coordinates
        run: |
          echo "BACKEND_IMAGE_NAME=${{ steps.image.outputs.runtime }}"
          echo "BACKEND_IMAGE_TAG=${{ steps.image.outputs.tag }}"
