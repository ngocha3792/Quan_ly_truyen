name: Publish Frontend Image

on:
  workflow_dispatch:

  push:
    tags:
      - "frontend-v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify frontend release source

    permissions:
      actions: read
      contents: read

    runs-on: ubuntu-latest

    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      ci_run_url: ${{ steps.required-ci.outputs.run_url }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6

        with:
          fetch-depth: 1

      - name: Resolve immutable release SHA
        id: source

        working-directory: .

        shell: bash

        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"

          if ! [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve release source SHA."

            exit 1
          fi

          echo "sha=${source_sha}" >> "$GITHUB_OUTPUT"

          echo "Frontend release SHA: ${source_sha}"

      - name: Require successful CI for exact SHA on main
        id: required-ci
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          runs_json="$(
            gh api \
              --method GET \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="${SOURCE_SHA}" \
              -f per_page=100
          )"

          successful_run="$(
            jq -c \
              --arg sha "${SOURCE_SHA}" \
              '[
                .workflow_runs[]
                | select(.head_sha == $sha)
                | select(.event == "push")
                | select(.head_branch == "main")
                | select(.status == "completed")
                | select(.conclusion == "success")
              ]
              | sort_by(.run_number)
              | reverse
              | .[0] // empty' \
              <<<"${runs_json}"
          )"

          if test -z "${successful_run}"; then
            echo "No successful CI workflow run was found for exact SHA ${SOURCE_SHA} on main."
            echo "Frontend images will not be published until the exact commit has passed full CI on main."
            exit 1
          fi

          run_url="$(jq -r '.html_url' <<<"${successful_run}")"
          run_number="$(jq -r '.run_number' <<<"${successful_run}")"

          echo "Verified CI run #${run_number}: ${run_url}"
          echo "run_url=${run_url}" >> "$GITHUB_OUTPUT"

          {
            echo "## Frontend release verification"
            echo
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Required CI run: [#${run_number}](${run_url})"
            echo "- Result: successful full CI on \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v6

        with:
          node-version-file: .nvmrc

          cache: npm

          cache-dependency-path: frontend/package-lock.json

      - name: Install and verify source
        shell: bash

        run: |
          set -euo pipefail

          npm install \
            --global \
            npm@11.12.1

          npm ci \
            --no-audit \
            --no-fund

          npm run ci

  publish:
    name: Scan and publish verified frontend image

    needs:
      - verify

    permissions:
      contents: read
      packages: write
      id-token: write

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout verified source SHA
        uses: actions/checkout@v6

        with:
          ref: ${{ needs.verify.outputs.source_sha }}

          fetch-depth: 1

      - name: Verify checkout did not drift
        shell: bash

        env:
          EXPECTED_SHA: ${{ needs.verify.outputs.source_sha }}

        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          if test "${actual_sha}" != "${EXPECTED_SHA}"; then
            echo "Frontend release source drift detected."

            echo "Expected: ${EXPECTED_SHA}"

            echo "Actual:   ${actual_sha}"

            exit 1
          fi

      - name: Set image coordinates
        id: image

        shell: bash

        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}

        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY_OWNER,,}"

          echo "name=ghcr.io/${owner}/quan-ly-truyen-frontend" >> "$GITHUB_OUTPUT"

          echo "sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

          echo "release=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # Local security build.
      # ------------------------------------------------------------

      - name: Build frontend image for security scan
        uses: docker/build-push-action@v6

        with:
          context: frontend

          file: frontend/Dockerfile

          build-args: NODE_IMAGE=node:24.15.0-alpine

          load: true

          tags: quan-ly-truyen-frontend:release-scan

          cache-from: type=gha,scope=frontend-runtime

          cache-to: type=gha,mode=max,scope=frontend-runtime

      - name: Scan frontend image before publish
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: quan-ly-truyen-frontend:release-scan

          format: table

          exit-code: "1"

          ignore-unfixed: true

          vuln-type: os,library

          severity: CRITICAL,HIGH

      # ------------------------------------------------------------
      # Registry access only happens after scan is green.
      # ------------------------------------------------------------

      - name: Login to GHCR
        uses: docker/login-action@v4

        with:
          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6

        with:
          context: frontend

          file: frontend/Dockerfile

          build-args: NODE_IMAGE=node:24.15.0-alpine

          push: true

          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.release }}

          cache-from: type=gha,scope=frontend-runtime

          cache-to: type=gha,mode=max,scope=frontend-runtime

          provenance: mode=max

          sbom: true

      - name: Deployment coordinates
        shell: bash

        run: |
          echo "FRONTEND_IMAGE_NAME=${{ steps.image.outputs.name }}"

          echo "FRONTEND_IMAGE_TAG=${{ steps.image.outputs.sha }}"

          echo "FRONTEND_RELEASE_TAG=${{ steps.image.outputs.release }}"

          echo "FRONTEND_SOURCE_SHA=${{ needs.verify.outputs.source_sha }}"