name: Publish Frontend Image

on:
  workflow_dispatch:

  push:
    tags:
      - "frontend-v*"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and verify source
        run: |
          npm install --global npm@11.12.1
          npm ci --no-audit --no-fund
          npm run ci

  publish:
    needs: verify
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image coordinates
        id: image

        shell: bash

        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          echo "name=ghcr.io/${owner}/quan-ly-truyen-frontend" >> "$GITHUB_OUTPUT"

          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          echo "release=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3

        with:
          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6

        with:
          context: frontend

          file: frontend/Dockerfile

          build-args: NODE_IMAGE=node:24.18.0-alpine

          push: true

          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.release }}

          cache-from: type=gha,scope=frontend-runtime

          cache-to: type=gha,mode=max,scope=frontend-runtime

          provenance: mode=max

          sbom: true

      - name: Deployment coordinates
        run: |
          echo "FRONTEND_IMAGE_NAME=${{ steps.image.outputs.name }}"

          echo "FRONTEND_IMAGE_TAG=${{ steps.image.outputs.sha }}"

          echo "FRONTEND_RELEASE_TAG=${{ steps.image.outputs.release }}"
