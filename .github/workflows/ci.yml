name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NPM_VERSION: "11.12.1"

jobs:
  frontend-quality:
    name: Frontend / quality, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format and architecture guardrails
        run: npm run format:check && npm run architecture:check

      - name: Lint and strict typecheck
        run: npm run lint:check && npm run typecheck && npm run typecheck:e2e

      - name: Unit and regression tests
        run: npm run test:ci

      - name: Production build
        run: npm run build:ci

      - name: Verify browser artifact
        run: test -s dist/frontend/browser/index.html

      - name: Upload browser artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-browser-${{ github.sha }}
          path: frontend/dist/frontend/browser
          if-no-files-found: error
          retention-days: 3

  backend-quality:
    name: Backend / quality, unit coverage and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quan_ly_truyen_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quan_ly_truyen_test?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      QUEUE_ENABLED: "false"
      MAIL_ENABLED: "false"
      CLOUDINARY_ENABLED: "false"
      OBSERVABILITY_ENABLED: "false"
      METRICS_ENABLED: "false"
      SWAGGER_ENABLED: "false"
      JWT_ACCESS_SECRET: ci-access-secret-unique-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-unique-at-least-32-characters
      AUTH_CSRF_ENABLED: "true"
      AUTH_CSRF_SECRET: ci-csrf-secret-unique-at-least-32-characters
      AUTH_LOGIN_RATE_LIMIT_ENABLED: "true"
      AUTH_JWT_BLACKLIST_ENABLED: "true"
      AUTH_JWT_BLACKLIST_FAILURE_MODE: closed
      AUTH_ACCESS_AUTHORIZATION_CACHE_ENABLED: "true"
      MAIL_PAYLOAD_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      MAIL_PAYLOAD_ALLOW_LEGACY_PLAINTEXT_READ: "false"
      FRONTEND_PUBLIC_URL: http://localhost:4200
      APP_PUBLIC_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:4200

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Reject committed cloud database credentials
        working-directory: .
        shell: bash
        run: |
          if git grep -nEi 'db\.prisma\.io|postgres(ql)?://[^[:space:]]+@[^[:space:]]*(neon|supabase|render)' -- .; then
            echo 'Tracked files must not contain cloud database credentials.'
            exit 1
          fi

          if git ls-files --error-unmatch backend/docker/.env.docker >/dev/null 2>&1; then
            echo 'backend/docker/.env.docker is a local secret file and must not be tracked.'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate CI environment
        run: npm run ci:check-env

      - name: Format, lint and typecheck
        run: npm run format:check && npm run lint:check && npm run typecheck:scripts

      - name: Validate Prisma schema and migration layout
        run: npm run db:validate

      - name: Build application and worker
        run: npm run build

      - name: Verify runtime artifacts
        run: |
          test -s dist/main.js
          test -s dist/worker.js
          test -s dist/healthcheck/worker-heartbeat.healthcheck.js
          test -s dist/healthcheck/recovery-metrics.js

      - name: Critical module unit coverage gates
        run: npm run test:critical:unit:cov

      - name: All source unit tests
        run: npm test -- --runInBand

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  backend-integration:
    name: Backend / PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: backend-quality
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quan_ly_truyen_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quan_ly_truyen_test?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      REDIS_KEY_PREFIX: qlt:ci:integration
      ALLOW_UNSAFE_TEST_DB: "false"
      QUEUE_ENABLED: "false"
      MAIL_ENABLED: "false"
      CLOUDINARY_ENABLED: "false"
      OBSERVABILITY_ENABLED: "false"
      METRICS_ENABLED: "false"
      SWAGGER_ENABLED: "false"
      JWT_ACCESS_SECRET: ci-access-secret-unique-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-unique-at-least-32-characters
      AUTH_CSRF_ENABLED: "true"
      AUTH_CSRF_SECRET: ci-csrf-secret-unique-at-least-32-characters
      AUTH_JWT_BLACKLIST_ENABLED: "true"
      AUTH_JWT_BLACKLIST_FAILURE_MODE: closed
      AUTH_ACCESS_AUTHORIZATION_CACHE_ENABLED: "true"
      MAIL_PAYLOAD_ENCRYPTION_KEY: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      MAIL_PAYLOAD_ALLOW_LEGACY_PLAINTEXT_READ: "false"
      FRONTEND_PUBLIC_URL: http://localhost:4200
      APP_PUBLIC_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:4200

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quan_ly_truyen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d quan_ly_truyen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Wait for PostgreSQL
        run: npm run ci:wait-db

      - name: Apply migrations to the fresh database
        run: npm run db:migrate:deploy

      - name: Verify migration status and database constraints
        run: npm run db:migrate:status && npm run db:verify:constraints

      - name: Run all integration and API E2E suites
        run: npm run ci:integration

  dependency-audit:
    name: Dependencies / production audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Audit production dependency graph
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high

  container-build:
    name: Containers / reproducible build, vulnerability scan and smoke

    runs-on: ubuntu-latest

    timeout-minutes: 35

    needs:
      - frontend-quality
      - backend-quality

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quan_ly_truyen_container_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d quan_ly_truyen_container_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate hardened production Compose configuration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          docker compose \
            --env-file ops/production/compose.validation.env.example \
            -f compose.production.yml \
            -f compose.production.build.yml \
            config --quiet

          docker compose \
            --env-file ops/production/compose.validation.env.example \
            -f ops/observability/docker-compose.observability.yml \
            config --quiet

          if grep -RInE '(^|[[:space:]])image:[[:space:]].*:latest([[:space:]]|$|[}])' \
            compose.production.yml \
            compose.production.build.yml
          then
            echo 'Production Compose files must not contain :latest image fallbacks.'
            exit 1
          fi

      # ------------------------------------------------------------
      # Frontend
      # ------------------------------------------------------------

      - name: Build frontend image
        uses: docker/build-push-action@v6

        with:
          context: frontend

          file: frontend/Dockerfile

          load: true

          tags: quan-ly-truyen-frontend:ci

          build-args: NODE_IMAGE=node:24.15.0-alpine

          cache-from: type=gha,scope=ci-frontend

          cache-to: type=gha,mode=max,scope=ci-frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: quan-ly-truyen-frontend:ci

          format: table

          exit-code: "1"

          ignore-unfixed: true

          vuln-type: os,library

          severity: CRITICAL,HIGH

      - name: Smoke test frontend image
        shell: bash

        run: |
          set -euo pipefail

          container_id="$(
            docker run \
              --detach \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:size=32m,mode=1777 \
              --publish 8080:8080 \
              quan-ly-truyen-frontend:ci
          )"

          cleanup() {
            docker logs "$container_id" || true

            docker rm \
              --force \
              "$container_id" \
              >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          configured_user="$(docker inspect --format '{{.Config.User}}' quan-ly-truyen-frontend:ci)"

          if test -z "${configured_user}" -o "${configured_user}" = "root" -o "${configured_user}" = "0"; then
            echo "Frontend image must declare a non-root runtime user."
            exit 1
          fi

          frontend_ready=false

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8080/health \
              >/dev/null \
              && curl \
                --fail \
                --silent \
                --output /tmp/quan-ly-truyen-frontend-index.html \
                http://127.0.0.1:8080/index.html \
              && grep \
                --quiet \
                '<app-root' \
                /tmp/quan-ly-truyen-frontend-index.html
            then
              frontend_ready=true
              break
            fi

            if test "$(docker inspect --format '{{.State.Running}}' "${container_id}")" != 'true'; then
              echo 'Frontend container exited before becoming ready.'
              exit 1
            fi

            sleep 1
          done

          if test "${frontend_ready}" != 'true'; then
            echo 'Frontend container failed health/static artifact smoke checks.'
            exit 1
          fi

      # ------------------------------------------------------------
      # Backend runtime
      # ------------------------------------------------------------

      - name: Build backend runtime image
        uses: docker/build-push-action@v6

        with:
          context: backend

          file: backend/Dockerfile

          target: runtime

          load: true

          tags: quan-ly-truyen-backend:ci

          build-args: NODE_IMAGE=node:24.15.0-bookworm-slim

          cache-from: type=gha,scope=ci-backend-runtime

          cache-to: type=gha,mode=max,scope=ci-backend-runtime

      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: quan-ly-truyen-backend:ci

          format: table

          exit-code: "1"

          ignore-unfixed: true

          vuln-type: os,library

          severity: CRITICAL,HIGH

          skip-setup-trivy: true

      - name: Verify backend runtime image contents
        shell: bash

        run: |
          set -euo pipefail

          configured_user="$(docker inspect --format '{{.Config.User}}' quan-ly-truyen-backend:ci)"

          if test -z "${configured_user}" -o "${configured_user}" = "root" -o "${configured_user}" = "0"; then
            echo "Backend runtime image must declare a non-root runtime user."
            exit 1
          fi

          docker run \
            --rm \
            --entrypoint sh \
            quan-ly-truyen-backend:ci \
            -c '
              test -s dist/main.js &&
              test -s dist/worker.js &&
              test -s dist/healthcheck/worker-heartbeat.healthcheck.js &&
              test -d prisma/migrations
            '

      # ------------------------------------------------------------
      # Backend migration
      # ------------------------------------------------------------

      - name: Build backend migration image
        uses: docker/build-push-action@v6

        with:
          context: backend

          file: backend/Dockerfile

          target: migrate

          load: true

          tags: quan-ly-truyen-backend-migrate:ci

          build-args: NODE_IMAGE=node:24.15.0-bookworm-slim

          cache-from: type=gha,scope=ci-backend-migrate

          cache-to: type=gha,mode=max,scope=ci-backend-migrate

      - name: Scan backend migration image
        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: quan-ly-truyen-backend-migrate:ci

          format: table

          exit-code: "1"

          ignore-unfixed: true

          vuln-type: os,library

          severity: CRITICAL,HIGH

          skip-setup-trivy: true

      - name: Smoke test backend migration and runtime images
        shell: bash
        run: |
          set -euo pipefail

          database_url='postgresql://postgres:postgres@127.0.0.1:5432/quan_ly_truyen_container_smoke?schema=public'
          redis_url='redis://127.0.0.1:6379/0'
          api_container_id=''
          worker_container_id=''

          cleanup() {
            for container_id in "${worker_container_id}" "${api_container_id}"; do
              if test -n "${container_id}"; then
                docker logs "${container_id}" || true
                docker rm --force "${container_id}" >/dev/null 2>&1 || true
              fi
            done
          }

          trap cleanup EXIT

          migrate_user="$(
            docker inspect \
              --format '{{.Config.User}}' \
              quan-ly-truyen-backend-migrate:ci
          )"

          if test -z "${migrate_user}" -o "${migrate_user}" = "root" -o "${migrate_user}" = "0"; then
            echo 'Backend migration image must declare a non-root runtime user.'
            exit 1
          fi

          docker run \
            --rm \
            --network host \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=64m,mode=1777 \
            --env DATABASE_URL="${database_url}" \
            quan-ly-truyen-backend-migrate:ci

          common_env=(
            --env-file backend/.env.example
            --env NODE_ENV=test
            --env DATABASE_URL="${database_url}"
            --env REDIS_ENABLED=true
            --env REDIS_URL="${redis_url}"
            --env REDIS_KEY_PREFIX=qlt:ci:container-smoke
            --env MAIL_ENABLED=false
            --env CLOUDINARY_ENABLED=false
            --env OBSERVABILITY_ENABLED=false
            --env METRICS_ENABLED=false
            --env OTEL_SDK_DISABLED=true
            --env SWAGGER_ENABLED=false
            --env LOG_LEVEL=warn
            --env LOG_PRETTY=false
            --env ALLOW_IN_MEMORY_INFRASTRUCTURE_FALLBACK=false
          )

          api_container_id="$(
            docker run \
              --detach \
              --network host \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:size=64m,mode=1777 \
              "${common_env[@]}" \
              --env QUEUE_ENABLED=false \
              quan-ly-truyen-backend:ci
          )"

          api_ready=false

          for attempt in $(seq 1 60); do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:3000/api/v1/health/live \
              >/dev/null \
              && curl \
                --fail \
                --silent \
                http://127.0.0.1:3000/api/v1/health/ready \
                >/dev/null
            then
              api_ready=true
              break
            fi

            if test "$(docker inspect --format '{{.State.Running}}' "${api_container_id}")" != 'true'; then
              echo 'Backend API container exited before becoming ready.'
              exit 1
            fi

            sleep 1
          done

          if test "${api_ready}" != 'true'; then
            echo 'Backend API container failed liveness/readiness smoke checks.'
            exit 1
          fi

          worker_container_id="$(
            docker run \
              --detach \
              --network host \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:size=64m,mode=1777 \
              "${common_env[@]}" \
              --env QUEUE_ENABLED=true \
              --env QUEUE_WORKER_HEARTBEAT_ENABLED=true \
              --env WORKER_ROLE=queue \
              quan-ly-truyen-backend:ci \
              node dist/worker.js
          )"

          worker_ready=false

          for attempt in $(seq 1 45); do
            if docker exec \
              "${worker_container_id}" \
              node dist/healthcheck/worker-heartbeat.healthcheck.js
            then
              worker_ready=true
              break
            fi

            if test "$(docker inspect --format '{{.State.Running}}' "${worker_container_id}")" != 'true'; then
              echo 'Backend worker container exited before its heartbeat became healthy.'
              exit 1
            fi

            sleep 1
          done

          if test "${worker_ready}" != 'true'; then
            echo 'Backend worker container failed its heartbeat smoke check.'
            exit 1
          fi
  frontend-e2e:
    name: Full stack / Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [frontend-quality, backend-quality]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quan_ly_truyen_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quan_ly_truyen_test?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      REDIS_KEY_PREFIX: qlt:ci:e2e
      ALLOW_UNSAFE_TEST_DB: "false"
      QUEUE_ENABLED: "false"
      MAIL_ENABLED: "false"
      CLOUDINARY_ENABLED: "false"
      OBSERVABILITY_ENABLED: "false"
      METRICS_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
      SWAGGER_ENABLED: "false"
      LOG_LEVEL: warn
      LOG_PRETTY: "false"
      AUTH_ACCESS_AUTHORIZATION_CACHE_ENABLED: "true"
      AUTH_ACCESS_AUTHORIZATION_CACHE_TTL_SECONDS: "5"
      ALLOW_IN_MEMORY_INFRASTRUCTURE_FALLBACK: "false"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quan_ly_truyen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d quan_ly_truyen_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${NPM_VERSION}

      - name: Prepare backend environment
        working-directory: backend
        run: cp .env.example .env

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Migrate E2E database
        working-directory: backend
        run: |
          npm run ci:wait-db
          npm run db:migrate:deploy

      - name: Build and start backend
        working-directory: backend
        shell: bash
        run: |
          npm run build
          nohup npm run start:prod > backend-ci.log 2>&1 &
          echo $! > backend-ci.pid

      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Wait for backend readiness
        working-directory: frontend
        run: >-
          npx wait-on
          http://127.0.0.1:3000/api/v1/health/ready
          --timeout 120000

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run e2e:ci

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/backend-ci.log

      - name: Stop backend
        if: always()
        working-directory: backend
        shell: bash
        run: |
          if test -f backend-ci.pid; then
            kill "$(cat backend-ci.pid)" 2>/dev/null || true
          fi

  ci-success:
    name: CI / required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - frontend-quality
      - backend-quality
      - backend-integration
      - dependency-audit
      - container-build
      - frontend-e2e
    steps:
      - name: Verify all required jobs succeeded
        env:
          FRONTEND_QUALITY: ${{ needs.frontend-quality.result }}
          BACKEND_QUALITY: ${{ needs.backend-quality.result }}
          BACKEND_INTEGRATION: ${{ needs.backend-integration.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          CONTAINER_BUILD: ${{ needs.container-build.result }}
          FRONTEND_E2E: ${{ needs.frontend-e2e.result }}
        shell: bash
        run: |
          for result in \
            "$FRONTEND_QUALITY" \
            "$BACKEND_QUALITY" \
            "$BACKEND_INTEGRATION" \
            "$DEPENDENCY_AUDIT" \
            "$CONTAINER_BUILD" \
            "$FRONTEND_E2E"
          do
            if test "$result" != success; then
              echo "A required CI job finished with status: $result"
              exit 1
            fi
          done
