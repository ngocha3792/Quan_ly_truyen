<section class="page-shell with-sidebar">
  <aside class="left-menu">
    <h2>Danh mục</h2>
    @for (genre of genres; track genre.name) {
      <a href="#" (click)="$event.preventDefault()">{{ genre.name }}</a>
    }
  </aside>
  <article class="panel genre-page">
    <h1>Tất cả thể loại</h1>
    <div class="genre-grid">
      @for (genre of genres; track genre.name) {
        <a routerLink="/search"
          ><span>{{ genre.icon }}</span
          ><strong>{{ genre.name }}</strong
          ><small>{{ genre.count }}</small></a
        >
      }
    </div>
  </article>
</section>
