<article class="panel full-page-panel">
  <div class="toolbar">
    <div>
      <h2>Lịch sử giao dịch</h2>
      <p>Theo dõi các khoản nạp xu và gói thành viên.</p>
    </div>
    <div class="tabs compact-tabs">
      <button class="active" type="button">Tất cả</button>
      <button type="button">Nạp xu</button>
      <button type="button">Mua VIP</button>
    </div>
  </div>

  <div class="transaction-table-wrap">
    <table class="transaction-table">
      <thead>
        <tr>
          <th>Mã giao dịch</th>
          <th>Loại giao dịch</th>
          <th>Số tiền</th>
          <th>Trạng thái</th>
          <th>Thời gian</th>
        </tr>
      </thead>
      <tbody>
        @for (transaction of transactions; track transaction.id) {
          <tr>
            <td>{{ transaction.id }}</td>
            <td>{{ transaction.type }}</td>
            <td>{{ transaction.amount }}</td>
            <td>
              <span>{{ transaction.status }}</span>
            </td>
            <td>{{ transaction.date }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button class="active" type="button">1</button>
    <button type="button">2</button>
    <button type="button">›</button>
  </div>
</article>
