<article class="panel full-page-panel">
  <div class="toolbar">
    <div>
      <h2>Truyện theo dõi</h2>
      <p>Cập nhật mới nhất từ những truyện bạn quan tâm.</p>
    </div>
    <select aria-label="Sắp xếp">
      <option>Mới cập nhật</option>
      <option>Theo tên</option>
      <option>Lượt đọc</option>
    </select>
  </div>

  <div class="following-list">
    @for (story of stories.slice(0, 5); track story.id) {
      <article>
        <img [src]="story.image" [alt]="story.title" />
        <div>
          <strong>{{ story.title }}</strong>
          <a href="#" (click)="$event.preventDefault()">{{ story.chapter }}</a>
          <small>{{ story.updated }}</small>
        </div>
        <button type="button">Đọc ngay</button>
        <button type="button" class="icon-button"><app-account-center-icon name="bell" /></button>
      </article>
    }
  </div>
</article>
