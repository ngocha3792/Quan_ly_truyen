services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.15.0-bookworm-slim}

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate

      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.15.0-bookworm-slim}

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime

      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-node:24.15.0-alpine}

