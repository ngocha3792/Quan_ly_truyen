name: ${COMPOSE_PROJECT_NAME:-quan-ly-truyen-production}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-runtime-common: &runtime-common
  image: ${BACKEND_IMAGE_NAME:?BACKEND_IMAGE_NAME is required}:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG must be the full source Git SHA}
  env_file:
    - ${PRODUCTION_ENV_FILE:-.env.production}
  restart: unless-stopped
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  logging: *default-logging

x-tool-common: &tool-common
  image: ${BACKEND_IMAGE_NAME:?BACKEND_IMAGE_NAME is required}-migrate:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG is required}
  env_file:
    - ${PRODUCTION_ENV_FILE:-.env.production}
  restart: 'no'
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging: *default-logging

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-production-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1536m}
    cpus: ${POSTGRES_CPU_LIMIT:-1.50}
    pids_limit: 256
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-production-data:/data
    networks:
      - backend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-0.75}
    pids_limit: 128
    logging: *default-logging

  migrate:
    <<: *tool-common
    command:
      - npm
      - run
      - db:migrate:deploy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    <<: *tool-common
    profiles:
      - tools
    command:
      - npm
      - run
      - db:seed
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *runtime-common
    command:
      - node
      - dist/main.js
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    stop_grace_period: 30s
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    cpus: ${API_CPU_LIMIT:-1.00}

  worker:
    <<: *runtime-common
    command:
      - node
      - dist/worker.js
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'dist/healthcheck/worker-heartbeat.healthcheck.js']
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s
    stop_grace_period: 60s
    mem_limit: ${WORKER_MEMORY_LIMIT:-768m}
    cpus: ${WORKER_CPU_LIMIT:-1.00}

  frontend:
    image: ${FRONTEND_IMAGE_NAME:?FRONTEND_IMAGE_NAME is required}:${FRONTEND_IMAGE_TAG:?FRONTEND_IMAGE_TAG must be an immutable Git SHA}
    restart: unless-stopped

    expose:
      - '8080'

    environment:
      PORT: '8080'
      SSR_API_ORIGIN: http://api:3000
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      NG_ALLOWED_HOSTS: ${APP_DOMAIN:?APP_DOMAIN is required}

    depends_on:
      api:
        condition: service_healthy

    networks:
      - backend

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

    mem_limit: ${FRONTEND_MEMORY_LIMIT:-384m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.00}

    logging: *default-logging

    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    stop_grace_period: 15s

  recovery-metrics:
    image: ${BACKEND_IMAGE_NAME:?BACKEND_IMAGE_NAME is required}:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG must be the full source Git SHA}
    command:
      - node
      - dist/healthcheck/recovery-metrics.js
    restart: unless-stopped
    environment:
      RECOVERY_METRICS_PORT: '9464'
      RECOVERY_BACKUP_STATUS_FILE: /backups/backup-last-success.json
      RECOVERY_RESTORE_DRILL_STATUS_FILE: /backups/restore-drill/restore-drill-last-success.json
      BACKUP_RPO_HOURS: ${BACKUP_RPO_HOURS:-26}
      RESTORE_DRILL_MAX_AGE_DAYS: ${RESTORE_DRILL_MAX_AGE_DAYS:-8}
      OFFSITE_BACKUP_ENABLED: ${OFFSITE_BACKUP_ENABLED:-false}
    expose:
      - '9464'
    volumes:
      - ${POSTGRES_BACKUP_DIRECTORY:-./backups}:/backups:ro
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: ${RECOVERY_METRICS_MEMORY_LIMIT:-128m}
    cpus: ${RECOVERY_METRICS_CPU_LIMIT:-0.25}
    logging: *default-logging
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9464/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1));",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}

    restart: unless-stopped

    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}

    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'

    volumes:
      - ./ops/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-production-data:/data
      - caddy-production-config:/config

    networks:
      - backend

    depends_on:
      api:
        condition: service_healthy

      frontend:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /tmp:size=32m,mode=1777

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    cpus: ${CADDY_CPU_LIMIT:-0.50}

    logging: *default-logging

    healthcheck:
      test: ['CMD-SHELL', 'caddy version >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  gate-predeploy:
    <<: *tool-common
    profiles:
      - tools
    command:
      - npm
      - run
      - production:gate:predeploy
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gate-postdeploy:
    <<: *tool-common
    profiles:
      - tools
    command:
      - npm
      - run
      - production:gate:postdeploy
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy

  auth-cleanup:
    <<: *tool-common
    profiles:
      - maintenance
    command:
      - npm
      - run
      - maintenance:auth-cleanup
      - --
      - --apply
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-cleanup:
    <<: *tool-common
    profiles:
      - maintenance
    command:
      - npm
      - run
      - maintenance:outbox-cleanup
      - --
      - --apply
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mail-queue-cleanup:
    <<: *tool-common
    profiles:
      - maintenance
    command:
      - npm
      - run
      - maintenance:mail-queue-cleanup
      - --
      - --apply
    depends_on:
      redis:
        condition: service_healthy

  backup-postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    profiles:
      - maintenance
    restart: 'no'

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}

    command:
      - sh
      - -ec
      - |
        # 022 (not the tighter 077) so an unprivileged deploy
        # user/CI pipeline can still read and relocate backups; this
        # host only ever grants SSH access to trusted operators.
        umask 022

        timestamp="$$(date -u +%Y%m%dT%H%M%SZ)"
        filename="quan_ly_truyen-$${timestamp}.dump"
        dump="/backups/$${filename}"

        pg_dump \
          --host=postgres \
          --username="$${POSTGRES_USER}" \
          --dbname="$${POSTGRES_DB}" \
          --format=custom \
          --compress=9 \
          --file="$${dump}"

        # Verify archive structure immediately.
        pg_restore --list "$${dump}" >/dev/null

        # Store checksum using a relative filename so the
        # checksum still works after an off-host restore.
        (
          cd /backups
          sha256sum "$${filename}" > "$${filename}.sha256"
        )

        find /backups \
          -type f \
          -mtime "+$${BACKUP_RETENTION_DAYS}" \
          -delete

        echo "Backup completed: $${dump}"

    volumes:
      - ${POSTGRES_BACKUP_DIRECTORY:-./backups}:/backups

    networks:
      - backend

    depends_on:
      postgres:
        condition: service_healthy

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128
    mem_limit: ${BACKUP_MEMORY_LIMIT:-512m}
    cpus: ${BACKUP_CPU_LIMIT:-0.75}

    logging: *default-logging

  backup-offsite:
    image: ${RESTIC_IMAGE:?RESTIC_IMAGE is required}
    profiles:
      - maintenance

    restart: 'no'

    hostname: ${BACKUP_HOST_ID:-quan-ly-truyen-production}

    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_repository_password

      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}

    volumes:
      - ${POSTGRES_BACKUP_DIRECTORY:-./backups}:/backups:ro

      - ./ops/production/secrets/restic_repository_password:/run/secrets/restic_repository_password:ro

    networks:
      - backend

    read_only: true

    tmpfs:
      - /tmp:size=128m,mode=1777
      - /root/.cache:size=128m,mode=0700

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128
    mem_limit: ${BACKUP_OFFSITE_MEMORY_LIMIT:-512m}
    cpus: ${BACKUP_OFFSITE_CPU_LIMIT:-0.50}

    logging: *default-logging

  postgres-restore-drill:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}

    profiles:
      - restore-drill

    restart: 'no'

    environment:
      POSTGRES_DB: ${RESTORE_DRILL_POSTGRES_DB:-qlt_restore_drill}
      POSTGRES_USER: ${RESTORE_DRILL_POSTGRES_USER:-qlt_restore}
      POSTGRES_PASSWORD: ${RESTORE_DRILL_POSTGRES_PASSWORD:-}

    networks:
      - backend

    # Quan trọng: không dùng production volume.
    # Container bị xóa => toàn bộ restored DB biến mất.
    tmpfs:
      - /var/lib/postgresql/data:size=${RESTORE_DRILL_TMPFS_SIZE:-2g},mode=0700
      - /tmp:size=64m,mode=1777

    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128
    mem_limit: ${RESTORE_DRILL_MEMORY_LIMIT:-1024m}
    cpus: ${RESTORE_DRILL_CPU_LIMIT:-1.00}

    logging: *default-logging

networks:
  backend:
    name: ${COMPOSE_PROJECT_NAME:-quan-ly-truyen-production}-backend
    driver: bridge

volumes:
  postgres-production-data:
  redis-production-data:
  caddy-production-data:
  caddy-production-config:
