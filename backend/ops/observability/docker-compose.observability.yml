name: ${OBSERVABILITY_COMPOSE_PROJECT_NAME:?OBSERVABILITY_COMPOSE_PROJECT_NAME is required}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?ALERTMANAGER_IMAGE is required}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../production/secrets/alert_webhook_url:/run/secrets/alert_webhook_url:ro
      - alertmanager-data:/alertmanager
    ports:
      - '127.0.0.1:${ALERTMANAGER_HOST_PORT:?}:9093'
    networks:
      - observability
    restart: unless-stopped
    mem_limit: ${ALERTMANAGER_MEMORY_LIMIT:-256m}
    cpus: ${ALERTMANAGER_CPU_LIMIT:-0.25}
    pids_limit: 128
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.10.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ../production/secrets/metrics_bearer_token:/run/secrets/metrics_bearer_token:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_HOST_PORT:?}:9090'
    networks:
      - observability
      - backend
    depends_on:
      - alertmanager
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEMORY_LIMIT:-768m}
    cpus: ${PROMETHEUS_CPU_LIMIT:-0.75}
    pids_limit: 256
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.2
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - '127.0.0.1:${LOKI_HOST_PORT:?}:3100'
    networks:
      - observability
    restart: unless-stopped
    mem_limit: ${LOKI_MEMORY_LIMIT:-768m}
    cpus: ${LOKI_CPU_LIMIT:-0.75}
    pids_limit: 256
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.10.5
    command:
      - -config.file=/etc/tempo/config.yml
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - '127.0.0.1:${TEMPO_HOST_PORT:?}:3200'
    networks:
      - observability
    restart: unless-stopped
    mem_limit: ${TEMPO_MEMORY_LIMIT:-768m}
    cpus: ${TEMPO_CPU_LIMIT:-0.75}
    pids_limit: 256
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:?DEPLOYMENT_ENVIRONMENT is required}
      TARGET_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '127.0.0.1:${ALLOY_HOST_PORT:?}:12345'
    networks:
      - observability
      - backend
    depends_on:
      - loki
      - tempo
    restart: unless-stopped
    mem_limit: ${ALLOY_MEMORY_LIMIT:-512m}
    cpus: ${ALLOY_CPU_LIMIT:-0.75}
    pids_limit: 256
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:?}:3000'
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEMORY_LIMIT:-512m}
    cpus: ${GRAFANA_CPU_LIMIT:-0.75}
    pids_limit: 256
    logging: *default-logging

networks:
  observability:
    driver: bridge
  backend:
    external: true
    name: ${OBSERVABILITY_BACKEND_NETWORK:?OBSERVABILITY_BACKEND_NETWORK is required}

volumes:
  alertmanager-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
